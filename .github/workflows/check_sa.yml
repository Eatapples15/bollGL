name: Aggiornamento Quotidiano Bollettino Salerno

on:
  schedule:
    # Esegue ogni giorno alle 10:00 UTC (11:00 italiane)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permette di avviarlo anche manualmente per test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso per salvare le modifiche nel repository

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v3

      - name: Configurazione Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installazione librerie
        run: |
          pip install requests beautifulsoup4

      - name: Esecuzione script di analisi
        run: python monitor_salerno.py

      - name: Salvataggio risultati nel repository
        run: |
          git config --global user.name "SalernoBot"
          git config --global user.email "bot@github.com"
          git add README.md
          git commit -m "Aggiornamento bollettino del $(date +'%d-%m-%Y')" || exit 0
          git push
