name: Monitor Sud Italia
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests beautifulsoup4
      - run: python monitor_meteo.py
      - name: Commit changes
        run: |
          git config --global user.name "MeteoMapBot"
          git config --global user.email "bot@github.com"
          git add README.md data_mappa.json
          git commit -m "Update dati $(date +'%d-%m-%Y')" || exit 0
          git push
